
name: sms-gateway

services:
  backend:
    image: ghcr.io/john3888/sms-gateway-api:latest
    build:
      context: .
      dockerfile: Dockerfile.api
    restart: unless-stopped
    env_file:
      - ./backend/.env
      - path: ./backend/.env.docker
        required: false
    environment:
      HOST: "0.0.0.0"
      PORT: "8500"
    volumes:
      - ./backend/app-keys.json:/app/app-keys.json:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command: >
      sh -ec 'if [ -n "$$DATABASE_URL" ]; then
      ./node_modules/.bin/prisma migrate deploy;
      fi;
      exec node dist/src/server.js'
    ports:
      - "8500:8500"

  frontend:
    image: ghcr.io/john3888/sms-gateway-web:latest
    build:
      context: .
      dockerfile: Dockerfile.web
      args:
        GATEWAY_ORIGIN: http://backend:8500
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "8501:8501"
