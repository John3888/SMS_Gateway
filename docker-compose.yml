name: sms-gateway

services:
  backend:  
    image: ghcr.io/john3888/sms-gateway-api:latest
    restart: unless-stopped
    env_file:
      - .env
      - path: ./backend/.env.docker
        required: false
    environment:
      HOST: "0.0.0.0"
      PORT: "5400"
      APP_KEYS_FILE: "/app/app-keys.json"
    volumes:
      - ./app-keys.json:/app/app-keys.json:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command: >
      sh -ec 'if [ -n "$$DATABASE_URL" ]; then
      ./node_modules/.bin/prisma migrate deploy;
      fi;
      exec node dist/src/server.js'
    ports:
      - "127.0.0.1:5400:5400"
    networks:
      - mysqldb-nt-network


  frontend:
    image: ghcr.io/john3888/sms-gateway-web:latest
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "127.0.0.1:3400:3400"
    networks:
      - mysqldb-nt-network

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - backend
      - frontend
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - mysqldb-nt-network

networks:
  mysqldb-nt-network:
    external: true

volumes:
  caddy_data:
  caddy_config:
