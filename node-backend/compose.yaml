services:
  sms-backend:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      HOST: 0.0.0.0
      PORT: "3000"
      DB_PATH: /app/data/sms.sqlite
      APP_KEYS_FILE: /app/app-keys.json
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - sms-data:/app/data
      - ./app-keys.json:/app/app-keys.json:ro
volumes:
  sms-data:
