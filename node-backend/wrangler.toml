name = "sms-relay"
main = "src/cloudflare/worker.mjs"
compatibility_date = "2026-11-04"
workers_dev = true

[dev]
ip = "127.0.0.1"
port = 8787

[vars]
MAX_PENDING = "100"
GLOBAL_SMS_PER_MINUTE = "12"
GLOBAL_SMS_BURST = "10"

[[durable_objects.bindings]]
name = "GATEWAY"
class_name = "GatewayHub"

[[migrations]]
tag = "v1-websocket"
new_sqlite_classes = ["GatewayHub"]
